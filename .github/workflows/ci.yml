name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --frozen

      - name: Compile sources
        run: uv run python -m compileall -q src

      # PostgreSQL and Ollama are not available on the runner; integration tests run locally.
      - name: Run offline tests
        run: uv run pytest -m "not integration" -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render the chart (helm is preinstalled on GitHub runners)
        run: |
          helm lint deploy/helm/tata-rag
  
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
