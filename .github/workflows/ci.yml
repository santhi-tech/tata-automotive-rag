name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --frozen

      - name: Compile sources
        run: uv run python -m compileall -q src

      - name: Run offline tests
        run: uv run pytest -m "not integration" -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render the chart (helm is preinstalled on GitHub runners)
        run: |
          helm lint deploy/helm/tata-rag

  image:
    # Only build images on: main branch push OR tag push (v0.2.0)
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version (git-tag-driven, not code-driven)
        id: metadata
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag push: v0.2.0 → extract version 0.2.0
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
            IS_RELEASE="true"
          else
            # Regular main push: use dev version from pyproject.toml + build number
            BASE_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
            VERSION="${BASE_VERSION}+build.${{ github.run_number }}"
            IS_RELEASE="false"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (Release: $IS_RELEASE)"

      # Only update pyproject.toml on release tags
      - name: Update pyproject.toml on release (idempotent)
        if: steps.metadata.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Commit only if changed
          if git diff --quiet pyproject.toml; then
            echo "pyproject.toml already at $VERSION"
          else
            git add pyproject.toml
            git commit -m "chore: bump version to $VERSION"
            git push
            echo "Updated pyproject.toml to $VERSION"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.is_release == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
