name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --frozen

      - name: Compile sources
        run: uv run python -m compileall -q src

      # PostgreSQL and Ollama are not available on the runner; integration tests run locally.
      - name: Run offline tests
        run: uv run pytest -m "not integration" -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render the chart (helm is preinstalled on GitHub runners)
        run: |
          helm lint deploy/helm/tata-rag
  
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag (release vs patch auto-increment)
        id: tag
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          IS_RELEASE=$(echo "$COMMIT_MSG" | grep -iE "(release|merge pull request)" | wc -l)
          BASE_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)

          if [ "$IS_RELEASE" -gt 0 ]; then
            TAG="v${BASE_VERSION}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Release merge → $TAG"
          else
            LAST_TAG=$(git tag -l "v${BASE_VERSION%.*}.*" --sort=-version:refname | head -1)
            if [ -z "$LAST_TAG" ]; then
              PATCH=1
            else
              PATCH=$(echo "$LAST_TAG" | sed "s/.*\\.//" | xargs -I {} sh -c 'echo $(({}+1))')
            fi
            TAG="v${BASE_VERSION}.${PATCH}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Regular commit → patch tag $TAG"
          fi

      - name: Create and push git tag
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
