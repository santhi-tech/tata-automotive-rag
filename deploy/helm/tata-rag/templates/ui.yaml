apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ui
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ui
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: ui
          {{- include "tata-rag.container" . | nindent 10 }}
          command: ["python", "-m", "streamlit", "run", "/app/src/app/ui_streamlit.py",
                    "--server.port", "{{ .Values.ui.port }}", "--server.address", "0.0.0.0", "--server.headless", "true"]
          ports:
            - containerPort: {{ .Values.ui.port }}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: {{ .Values.ui.port }}}
          livenessProbe:
            httpGet: {path: /_stcore/health, port: {{ .Values.ui.port }}}
            initialDelaySeconds: 20
          volumeMounts:
            - name: data
              mountPath: {{ .Values.env.IMAGE_DATA_DIR }}
              readOnly: true
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        {{- include "tata-rag.dataVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
spec:
  selector:
    app: {{ .Release.Name }}-ui
  ports:
    - port: {{ .Values.ui.port }}
      targetPort: {{ .Values.ui.port }}
