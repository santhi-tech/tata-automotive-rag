[project]
name = "tata-automotive-rag"
version = "0.1.0"
description = "RAG pipeline for automotive product pages: Playwright ingestion, pgvector hybrid search, Ollama, FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "playwright",
    "pillow",
    "pytesseract",
    "asyncpg",
    "requests>=2.34.2",
    "dotenv>=0.9.9",
    "streamlit>=1.65.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["integration: needs a running PostgreSQL (pgvector) and/or Ollama; skipped in CI"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
